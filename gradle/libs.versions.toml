
[versions]

agp = "8.11.1"

constraintlayoutVersion = "2.2.2"

core = "3.5.4"

datastorePreferences = "1.2.1"

kotlin = "2.2.20"

kotlinxCoroutinesAndroidVersion = "1.11.0"

ksp = "2.2.20-2.0.3"

coreKtx = "1.17.0"

appcompat = "1.8.0"

lifecycleRuntimeKtx = "2.11.0"

lifecycleViewmodelKtx = "2.11.0"

loggingInterceptor = "5.5.0"
material = "1.14.0"
activityKtx = "1.13.0"

fragmentKtx = "1.8.9"

msalVersion = "8.5.0"

recyclerview = "1.4.0"

navigationFragmentKtx = "2.10.1"

navigationUiKtx = "2.10.1"

room = "2.8.5"

retrofit = "3.0.0"

gsonConverter = "3.0.0"

workManager = "2.11.2"

biometric = "1.1.0"

firebaseBom = "34.19.0"

zxingEmbedded = "4.3.0"

junit = "4.13.2"

junitVersion = "1.3.0"

espressoCore = "3.7.0"

[libraries]

# AndroidX
androidx-constraintlayout-v222 = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayoutVersion" }

androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }

androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }

androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "activityKtx" }

androidx-datastore-preferences-v121 = { module = "androidx.datastore:datastore-preferences", version.ref = "datastorePreferences" }

androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragmentKtx" }

androidx-lifecycle-runtime-ktx-v2110 = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }

androidx-lifecycle-viewmodel-ktx-v2110 = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycleViewmodelKtx" }

androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }

# Material
material = { module = "com.google.android.material:material", version.ref = "material" }

# Coroutines
google-kotlinx-coroutines-android-v1110 = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutinesAndroidVersion" }

logging-interceptor-v550 = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "loggingInterceptor" }

# Navigation
androidx-navigation-fragment-ktx = { module = "androidx.navigation:navigation-fragment-ktx", version.ref = "navigationFragmentKtx" }

androidx-navigation-ui-ktx = { module = "androidx.navigation:navigation-ui-ktx", version.ref = "navigationUiKtx" }

# Room
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }

androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }

androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

# MSAL
msal-v850 = { module = "com.microsoft.identity.client:msal", version.ref = "msalVersion" }

# Retrofit
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }

converter-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "gsonConverter" }

# WorkManager
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "workManager" }

# Biometrics
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }

# Firebase
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }

# QR Scanner
core-v354 = { module = "com.google.zxing:core", version.ref = "core" }
zxing-embedded = { module = "com.journeyapps:zxing-android-embedded", version.ref = "zxingEmbedded" }

# Testing
junit = { module = "junit:junit", version.ref = "junit" }

androidx-junit = { module = "androidx.test.ext:junit", version.ref = "junitVersion" }

androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espressoCore" }

[plugins]

android-application = { id = "com.android.application", version.ref = "agp" }

kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }

ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
